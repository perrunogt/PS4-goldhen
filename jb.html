<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HOST: PERRUNOGT</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

      :root {
        --color-bg: #030708;
        --color-initial: #00ff88;
        --color-ok: #00ff88;
        --color-fail: #ff3333;
        --color-text: #e0e6ed;
        --glass: blur(20px) saturate(180%);
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--color-bg);
        font-family: 'Inter', sans-serif;
        color: var(--color-text);
        overflow: hidden;
        perspective: 1000px;
      }

      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
          radial-gradient(at 50% 50%, rgba(0, 255, 136, 0.12) 0px, transparent 60%),
          linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 30px 30px, 30px 30px;
        opacity: 0.8;
        z-index: -1;
      }

      #main-container {
        position: relative;
        width: 90%;
        max-width: 420px;
        aspect-ratio: 1/1;
        background: rgba(4, 15, 12, 0.65);
        backdrop-filter: var(--glass);
        -webkit-backdrop-filter: var(--glass);
        border: 1px solid rgba(0, 255, 136, 0.3);
        border-radius: 24px;
        clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: all 0.6s var(--ease);
        box-shadow: 0 0 30px rgba(0, 255, 136, 0.15),
                    inset 0 0 15px rgba(0, 255, 136, 0.1);
      }

      body.done #main-container {
        box-shadow: 0 0 50px rgba(0, 255, 136, 0.35),
                    inset 0 0 25px rgba(0, 255, 136, 0.2);
        border-color: rgba(0, 255, 136, 0.8);
      }

      body.fail #main-container {
        box-shadow: 0 0 50px rgba(255, 51, 51, 0.35),
                    inset 0 0 25px rgba(255, 51, 51, 0.2);
        border-color: rgba(255, 51, 51, 0.8);
      }

      #brand {
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 35px;
        background: linear-gradient(135deg, #ffffff 0%, #00ff88 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        transition: all 0.5s var(--ease);
        filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.5));
      }

      body.done #brand {
        filter: drop-shadow(0 0 18px var(--color-ok));
        background: var(--color-ok);
        -webkit-background-clip: text;
      }

      body.fail #brand {
        filter: drop-shadow(0 0 18px var(--color-fail));
        background: var(--color-fail);
        -webkit-background-clip: text;
      }

      #visual-indicator {
        position: relative;
        width: 110px;
        height: 110px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Animated Cyber Frame取代 spin */
      #spin {
        position: absolute;
        inset: 0;
        border: 2px dashed var(--color-initial);
        border-radius: 50%;
        animation: cyber-rotate 6s linear infinite;
        opacity: 0.8;
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        transition: all 0.5s var(--ease);
      }

      .pulse {
        position: absolute;
        width: 75%;
        height: 75%;
        border-radius: 50%;
        border: 2px solid var(--color-initial);
        animation: cyber-radar 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transition: all 0.5s var(--ease);
      }

      .core {
        width: 28px;
        height: 28px;
        background-color: var(--color-initial);
        transform: rotate(45deg);
        transition: all 0.5s var(--ease);
        box-shadow: 0 0 20px var(--color-initial), inset 0 0 10px #ffffff;
      }

      body.done #spin {
        border-style: solid;
        border-color: var(--color-ok);
        animation: none;
        box-shadow: 0 0 25px var(--color-ok);
      }
      body.done .pulse { border-color: var(--color-ok); animation: none; opacity: 0.3; }
      body.done .core { background-color: var(--color-ok); box-shadow: 0 0 30px var(--color-ok); }

      body.fail #spin {
        border-style: solid;
        border-color: var(--color-fail);
        animation: none;
        box-shadow: 0 0 25px var(--color-fail);
      }
      body.fail .pulse { border-color: var(--color-fail); animation: none; opacity: 0.3; }
      body.fail .core { background-color: var(--color-fail); box-shadow: 0 0 30px var(--color-fail); }

      #msg {
        position: fixed;
        top: calc(50% + 120px);
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: var(--color-fail);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        display: none;
        text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
      }
      body.fail #msg { display: block; }

      #wrap { padding: 0; }
      #state, #out { display: none; }
      body.log body::before,
      body.log #main-container,
      body.log #footer {
        display: none;
      }
      body.log {
        overflow: auto;
        display: block;
        padding: 20px;
        background: var(--color-bg);
      }
      body.log #wrap {
        display: block;
        max-width: 900px;
        margin: 0 auto;
      }
      body.log #state {
        display: block;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--color-ok);
        font-family: 'JetBrains Mono', monospace;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.6 'JetBrains Mono', monospace;
        background: rgba(0, 255, 136, 0.03);
        border: 1px solid rgba(0, 255, 136, 0.15);
        border-radius: 12px;
        padding: 16px;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        color: var(--color-text);
      }

      .ok { color: var(--color-ok); }
      .bad { color: var(--color-fail); }
      .warn { color: #e3b341; }
      .safe { color: var(--color-ok); }
      .danger { color: var(--color-fail); }
      code { color: #8b9bb4; font-family: 'JetBrains Mono', monospace; }

      @keyframes cyber-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes cyber-radar {
        0% { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(1.3); opacity: 0; }
      }

      #footer {
        position: fixed;
        bottom: 25px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: rgba(0, 255, 136, 0.6);
        letter-spacing: 0.25em;
        text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
      }
    </style>
  </head>
  <body>

    <div id="main-container">
        <div id="brand">HOST: PERRUNOGT</div>
        <div id="visual-indicator">
            <div id="spin"></div>
            <div class="pulse"></div>
            <div class="core"></div>
        </div>
    </div>

    <div id="msg">Restart your console</div>
    
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <div id="footer">PERRUNOGT // PS4 HOST</div>

    <script type="module">
      import "./jb.js?v=10";
    </script>

  </body>
</html>
